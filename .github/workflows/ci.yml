name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Verify package signatures
        run: npm audit signatures
      - name: Build (validates every content entry against its schema)
        run: npm run build
      - name: Check the CSP header matches the built inline scripts
        run: npm run csp
      - name: Check for stale entries (older than 90 days)
        run: node scripts/check-freshness.mjs
