name: News update

# While the site is tested, run this by hand: Actions tab → News update → Run workflow.
# Before launch, uncomment the schedule to run daily (cron is UTC; 22:15 UTC is 06:15 in Taipei).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '15 22 * * *'

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fetch feeds and merge headlines
        run: npm run news
      - name: Validate before committing
        run: npm run build
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/data/news.json; then
            echo "No new headlines."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json
          git commit -m "news: update headlines $(date -u +%F)"
          git push
